<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocky Rat</title>
  </head>

  <body onload="main()">
    <canvas id="webgl" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>

    <p id="numdot">XXX</p>

    <p>
      <b>Mouse:</b> drag to rotate &nbsp; | &nbsp; <b>Shift-click:</b> poke animation
    </p>

    <p>
      Arm
      <input type="range" min="-45" max="45" value="0" class="slider" id="magentaSlide">
      Animation:
      <button type="button" id="animationMagentaOnButton">ON</button>
      <button type="button" id="animationMagentaOffButton">OFF</button>
    </p>

    <p>
      Arm
      <input type="range" min="-45" max="45" value="0" class="slider" id="yellowSlide">
      Animation:
      <button type="button" id="animationYellowOnButton">ON</button>
      <button type="button" id="animationYellowOffButton">OFF</button>
    </p>



    <p>
        Tail Animation:
        <button type="button" id="animationTailOnButton">ON</button>
        <button type="button" id="animationTailOffButton">OFF</button>
      </p>

      <button id="lightOnBtn">Lighting ON</button>
      <button id="lightOffBtn">Lighting OFF</button>


      <button id="normalsOnBtn">Show Normals</button>
      <button id="normalsOffBtn">Hide Normals</button>



    <p>
      Camera Angle
      <input type="range" min="0" max="90" value="5" class="slider" id="angleSlide">
    </p>
    <p>
        Light X
        <input type="range" id="lightSlideX" min="-0.9" max="0.9" value="0.3" step="0.01">
      </p>
      
      <p>
        Light Y
        <input type="range" id="lightSlideY" min="-0.9" max="0.9" value="0.6" step="0.01">
      </p>
      
      <p>
        Light Z
        <input type="range" id="lightSlideZ" min="-0.9" max="0.9" value="0.3" step="0.01">
      </p>
      <p>
        Light Color (warm ↔ cool)
        <input type="range" id="lightColorSlide" min="0" max="1" value="1" step="0.01">
      </p>

    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>

    <script src="Point.js"></script>
    <script src="Sphere.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script>
    <script src="Cube.js"></script>
    <script src="Model.js"></script>

    <script src="Lighting.js"></script>
  </body>
</html>
